name: Atualizar idade no perfil

on:
  schedule:
    # 00:05 no horário de Brasília; a rotina só cria commit quando a idade muda.
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Calcular e atualizar idade
        shell: bash
        run: |
          birth_year=2008
          birth_month=9
          birth_day=18

          current_year=$(date -u +%Y)
          current_month=$(date -u +%-m)
          current_day=$(date -u +%-d)

          age=$((current_year - birth_year))

          if ((current_month < birth_month || (current_month == birth_month && current_day < birth_day))); then
            age=$((age - 1))
          fi

          sed -i -E "s/(<!-- AGE:START -->)[0-9]+ anos(<!-- AGE:END -->)/\1${age} anos\2/g" README.md

      - name: Publicar mudança, se necessária
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "A idade já está correta."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: atualizar idade no perfil"
          git push
